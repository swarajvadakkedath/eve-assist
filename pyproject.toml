[project]
name = "aios"
version = "1.2.0"
description = "AI Operating System - Intelligent layer for Windows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "psutil>=5.9.0",
    "PyAutoGUI>=0.9.54",
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "playwright>=1.44.0",
    "pyperclip>=1.9.0",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "pyyaml>=6.0",
    "sse-starlette>=3.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

